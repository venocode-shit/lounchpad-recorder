name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Version to build (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install native build tools (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libx11-dev libxtst-dev libxrandr-dev libxt-dev

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      run: npm run build:win -- --publish never
      env:
        WHISPER_RUNTIME_ALLOW_MISSING: 1

    - name: Build (macOS)
      if: matrix.os == 'macos-latest'
      run: npm run build:mac -- --publish never
      env:
        WHISPER_RUNTIME_ALLOW_MISSING: 1

    - name: Build (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: npm run build:linux -- --publish=never
      env:
        WHISPER_RUNTIME_ALLOW_MISSING: 1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: release/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: List artifacts
      run: find ./artifacts -type f

    - name: Filter main application files
      run: |
        mkdir -p ./release-artifacts
        find ./artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" \) -exec cp {} ./release-artifacts/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./release-artifacts/*
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}